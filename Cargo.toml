[workspace]
resolver = "2"
members = [
    "crates/ferrovia-core",
    "crates/ferrovia-server",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT"
# Piso real das dependências (uuid 1.29 exige 1.89). Revisar ao atualizar o Cargo.lock.
rust-version = "1.89"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.53", features = ["sync"] }
